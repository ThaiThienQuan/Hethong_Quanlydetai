<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý hội đồng</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app-page">
<div th:replace="~{fragments/nav :: nav}"></div><div class="box xwide">
    <h2>Quản lý hội đồng phản biện</h2><a th:href="@{/}">&larr; Trang chủ</a>
    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <h3>Tạo hội đồng</h3>
    <form th:action="@{/head/councils}" th:object="${councilForm}" method="post">
        <label>Mã hội đồng</label>
        <input th:field="*{councilCode}" maxlength="30" placeholder="VD: HD-KLTN-25-A">
        <div class="field-error" th:errors="*{councilCode}"></div>
        <label>Tên hội đồng</label>
        <input th:field="*{councilName}" required maxlength="150">
        <div class="field-error" th:errors="*{councilName}"></div>
        <label>Đợt TLCN/KLTN</label>
        <select th:field="*{periodId}" required>
            <option value="">-- Chọn đợt --</option>
            <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name + ' (' + p.periodType.displayName + ')'}"></option>
        </select>
        <div class="field-error" th:errors="*{periodId}"></div>
        <label>Ngày báo cáo hội đồng (để trống: với đợt KLTN sẽ lấy theo ngày báo cáo hội đồng của đợt)</label>
        <input type="datetime-local" th:field="*{reportDate}">
        <button type="submit">Tạo hội đồng</button>
    </form>

    <h3>Danh sách hội đồng</h3>
    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu">
        <table>
            <thead><tr>
                <th>Mã</th><th>Tên</th><th>Đợt</th><th>Ngày</th>
                <th>Số thành viên</th><th>Số đề tài</th><th>Trạng thái</th><th></th>
            </tr></thead>
            <tbody>
            <tr th:each="c : ${councils}">
                <td th:text="${c.councilCode}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.periodName}"></td>
                <td th:text="${c.reportDate != null ? #temporals.format(c.reportDate, 'dd/MM/yyyy HH:mm') : ''}"></td>
                <td th:text="${#lists.size(c.members)}"></td>
                <td th:text="${#lists.size(c.topics)}"></td>
                <td th:text="${c.status}"></td>
                <td><a th:href="@{/head/councils/{id}(id=${c.id})}">Chi tiết</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(councils)}"><td colspan="8">Chưa tạo hội đồng.</td></tr>
            </tbody>
        </table>
    </div>
</div></body></html>
