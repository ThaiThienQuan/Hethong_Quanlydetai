<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý hội đồng')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
    <div class="box-head">
        <h2>Quản lý hội đồng phản biện</h2>
    </div>
    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <h3>Tạo hội đồng</h3>
    <form th:action="@{/head/councils}" th:object="${councilForm}" method="post">
        <div class="field-error" th:errors="*{councilCode}"></div>
        <label>Tên hội đồng</label>
        <input th:field="*{councilName}" required maxlength="150">
        <div class="field-error" th:errors="*{councilName}"></div>
        <label>Đợt TLCN/KLTN</label>
        <select th:field="*{periodId}" required>
            <option value="">-- Chọn đợt --</option>
            <option th:each="p : ${periods}" th:value="${p.id}"
                    th:data-period-type="${p.periodType.name()}"
                    th:data-council-report-date="${p.councilReportDate != null ? #temporals.format(p.councilReportDate, 'yyyy-MM-dd HH:mm') : ''}"
                    th:text="${p.name + ' (' + p.periodType.displayName + ')'}"></option>
        </select>
        <div class="field-error" th:errors="*{periodId}"></div>
        <label>Ngày báo cáo hội đồng</label>
        <input type="datetime-local" th:field="*{reportDate}">
        <button class="btn btn-primary" type="submit">Tạo hội đồng</button>
    </form>

    <h3>Danh sách hội đồng</h3>
    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu">
        <table>
            <thead><tr>
                <th>Mã</th><th>Tên</th><th>Đợt</th><th>Ngày</th>
                <th>Số thành viên</th><th>Số đề tài</th><th>Trạng thái</th><th></th>
            </tr></thead>
            <tbody>
            <tr th:each="c : ${councils}">
                <td th:text="${c.councilCode}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.periodName}"></td>
                <td th:text="${c.reportDate != null ? #temporals.format(c.reportDate, 'dd/MM/yyyy HH:mm') : ''}"></td>
                <td th:text="${#lists.size(c.members)}"></td>
                <td th:text="${#lists.size(c.topics)}"></td>
                <td th:text="${c.status}"></td>
                <td><a th:href="@{/head/councils/{id}(id=${c.id})}">Chi tiết</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(councils)}"><td colspan="8">Chưa tạo hội đồng.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</main>

<!-- Xem trước mã hội đồng sắp được cấp khi Trưởng khoa đổi đợt TLCN/KLTN. -->
<script th:inline="javascript">
    (function () {
        var periodSelect = document.getElementById('periodId');
        var preview = document.getElementById('previewCouncilCode');
        var reportDateInput = document.getElementById('reportDate');
        var url = /*[[@{/head/councils/preview-code}]]*/ '';
        var autoFilled = '';

        /* Đợt KLTN: ngày báo cáo hội đồng lấy theo ngày báo cáo hội đồng của đợt
           (mục 5.6). Ô nhập được khoá lại để không ghi đè giá trị của đợt.
           Đợt TLCN: ngày do Trưởng khoa tự nhập. */
        function syncReportDate() {
            if (!periodSelect || !reportDateInput) return;
            var option = periodSelect.options[periodSelect.selectedIndex];
            var type = option ? option.getAttribute('data-period-type') : null;
            var periodDate = option ? option.getAttribute('data-council-report-date') : null;
            if (type === 'KLTN') {
                // data-council-report-date dạng "yyyy-MM-dd HH:mm" -> datetime-local cần "yyyy-MM-ddTHH:mm"
                var auto = periodDate ? periodDate.replace(' ', 'T') : '';
                reportDateInput.value = auto;
                autoFilled = auto;
                reportDateInput.readOnly = true;
            } else {
                // Chỉ xoá giá trị do chính script điền vào, không xoá giá trị người dùng nhập.
                if (autoFilled && reportDateInput.value === autoFilled) reportDateInput.value = '';
                autoFilled = '';
                reportDateInput.readOnly = false;
            }
        }

        function refresh() {
            var periodId = periodSelect ? periodSelect.value : '';
            if (!periodId) {
                if (preview) {
                    preview.value = '';
                    preview.placeholder = 'Chọn đợt TLCN/KLTN để xem mã';
                }
                syncReportDate();
                return;
            }
            fetch(url + '?periodId=' + encodeURIComponent(periodId),
                  { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(function (r) { return r.ok ? r.text() : ''; })
                .then(function (code) {
                    if (!preview) return;
                    preview.value = (code || '').trim();
                    if (!code) preview.placeholder = 'Không xem trước được mã, hệ thống sẽ tự cấp khi tạo';
                })
                .catch(function () {
                    if (preview) preview.placeholder = 'Không xem trước được mã, hệ thống sẽ tự cấp khi tạo';
                });
        }

        if (periodSelect) periodSelect.addEventListener('change', function () {
            syncReportDate();
            refresh();
        });
        syncReportDate();
        refresh();
    })();
</script>

</body>
</html>
