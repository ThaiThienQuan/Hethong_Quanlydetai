<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box">
    <div class="box-head">
        <h2>Đổi mật khẩu</h2>
    </div>
    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/account/password}" th:object="${passwordForm}" method="post">
        <label>Mật khẩu hiện tại</label><input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
        <label>Mật khẩu mới (ít nhất 8 ký tự, có chữ và số)</label>
        <input type="password" th:field="*{newPassword}" autocomplete="new-password" required minlength="8">
        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        <label>Nhập lại mật khẩu mới</label><input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        <button class="btn btn-primary" type="submit">Lưu mật khẩu mới</button>
    </form>
</div>
</main>

</body>
</html>
