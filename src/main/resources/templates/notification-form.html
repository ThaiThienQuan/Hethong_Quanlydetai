<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo | Khoa CNTT</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/security-module.css}">
</head>
<body>
<div class="page-shell">
    <header class="topbar-card">
        <div><div class="crumb">Thông báo / nội dung</div>
            <h1 th:text="${notification.id == null ? 'Tạo thông báo' : 'Sửa thông báo'}">Tạo thông báo</h1>
        </div>
        <div class="topbar-actions"><a th:href="@{/notifications}">Danh sách thông báo</a></div>
    </header>
    <section class="panel form-card">
        <form th:action="@{/notifications/save}" method="post" th:object="${notification}">
            <input type="hidden" th:field="*{id}">
            <div class="field full">
                <label for="title">Tiêu đề</label>
                <input id="title" type="text" th:field="*{title}" required maxlength="250">
            </div>
            <div class="field full">
                <label for="content">Nội dung</label>
                <textarea id="content" th:field="*{content}" rows="8" required></textarea>
            </div>
            <fieldset class="field full role-fieldset">
                <legend>Đối tượng nhận</legend>
                <div class="permission-list">
                    <label class="permission-item" th:each="role : ${roles}">
                        <input type="checkbox" name="targetRoleIds" th:value="${role.id}"
                               th:checked="${selectedTargetRoleIds.contains(role.id)}">
                        <span class="permission-meta">
                            <strong th:text="${role.name}">SINH_VIEN</strong>
                            <small th:text="${role.description}">Nhóm người dùng</small>
                        </span>
                    </label>
                </div>
            </fieldset>
            <div class="form-actions">
                <button class="primary-btn" type="submit">Lưu bản nháp</button>
                <a class="secondary-btn" th:href="@{/notifications}">Hủy</a>
            </div>
        </form>
    </section>
</div>
</body>
</html>
