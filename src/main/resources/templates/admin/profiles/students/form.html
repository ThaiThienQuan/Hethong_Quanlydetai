<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sửa hồ sơ sinh viên')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box narrow">
        <div class="box-head">
            <h2>Sửa hồ sơ sinh viên</h2>
            <div class="box-head-actions">
                <a class="back-link" th:href="@{/admin/profiles/students}">&larr; Quay lại danh sách</a>
            </div>
        </div>

        <form th:action="@{/admin/profiles/students/{id}/edit(id=${student.id})}" method="post">
            <div class="form-group">
                <label>Mã sinh viên</label>
                <input type="text" th:value="${student.studentCode}" disabled>
            </div>

            <div class="form-group">
                <label for="fullName">Họ tên</label>
                <input type="text" id="fullName" name="fullName" th:value="${student.user.fullName}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${student.user.email != null ? student.user.email : ''}">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="text" id="phone" name="phone" th:value="${student.user.phone != null ? student.user.phone : ''}">
            </div>

            <div class="form-group">
                <label for="className">Lớp</label>
                <input type="text" id="className" name="className" th:value="${student.className}" required>
            </div>

            <div class="form-group">
                <label for="major">Ngành</label>
                <input type="text" id="major" name="major" th:value="${student.major}" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn primary">💾 Lưu thay đổi</button>
                <a th:href="@{/admin/profiles/students}" class="btn secondary">Hủy</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
