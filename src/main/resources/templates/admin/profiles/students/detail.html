<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Xem chi tiết sinh viên')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box narrow">
        <div class="box-head">
            <h2>Chi tiết hồ sơ sinh viên</h2>
            <div class="box-head-actions">
                <a class="back-link" th:href="@{/admin/profiles/students}">&larr; Quay lại danh sách</a>
            </div>
        </div>

        <div class="detail-card">
            <dl class="detail-list">
                <dt>Mã sinh viên</dt>
                <dd><code th:text="${student.studentCode}">SV001</code></dd>
                
                <dt>Họ tên</dt>
                <dd th:text="${student.user.fullName}">Nguyễn Văn B</dd>
                
                <dt>Tài khoản</dt>
                <dd th:text="${student.user.username}">username</dd>
                
                <dt>Email</dt>
                <dd th:text="${student.user.email != null ? student.user.email : '—'}">email@edu.vn</dd>
                
                <dt>Số điện thoại</dt>
                <dd th:text="${student.user.phone != null ? student.user.phone : '—'}">—</dd>
                
                <dt>Lớp</dt>
                <dd th:text="${student.className}">CNTT-K63</dd>
                
                <dt>Ngành</dt>
                <dd th:text="${student.major}">Công nghệ thông tin</dd>
            </dl>
        </div>

        <div class="form-actions">
            <a th:href="@{/admin/profiles/students/{id}/edit(id=${student.id})}" class="btn primary">Sửa hồ sơ</a>
            <a th:href="@{/admin/profiles/students}" class="btn secondary">Đóng</a>
        </div>
    </div>
</main>

</body>
</html>
