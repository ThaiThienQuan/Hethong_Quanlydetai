<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hồ sơ sinh viên')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
        <div class="box-head">
            <h2>Hồ sơ sinh viên</h2>
        </div>

        <p class="ok" th:if="${message}" th:text="${message}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã SV</th>
                        <th>Họ tên</th>
                        <th>Lớp</th>
                        <th>Ngành</th>
                        <th>Email</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s, stat : ${students}">
                        <!-- Số thứ tự phải cộng offset của các trang trước (page.number * page.size),
                             nếu chỉ dùng stat.count thì mỗi trang đều bắt đầu lại từ 1. -->
                        <td th:text="${page.number * page.size + stat.count}">1</td>
                        <td><code th:text="${s.studentCode}">SV001</code></td>
                        <td th:text="${s.user.fullName}">Nguyễn Văn B</td>
                        <td th:text="${s.className}">CNTT-K63</td>
                        <td th:text="${s.major}">Công nghệ thông tin</td>
                        <td th:text="${s.user.email != null ? s.user.email : '—'}">email@edu.vn</td>
                        <td class="actions">
                            <a th:href="@{/admin/profiles/students/{id}(id=${s.id})}">Xem</a>
                            <a th:href="@{/admin/profiles/students/{id}/edit(id=${s.id})}">Sửa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7">Chưa có hồ sơ sinh viên nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Phân trang: dùng component .pagination có sẵn trong components.css.
             Chỉ hiện tối đa 9 số trang quanh trang hiện tại để không dồn hết
             khi bảng có hàng trăm trang. -->
        <nav th:if="${page != null and page.totalPages > 1}" class="pagination" aria-label="Phân trang hồ sơ sinh viên">
            <span class="info"
                  th:text="'Hiển thị ' + (page.number * page.size + 1) + '–'
                            + (page.number * page.size + students.size()) + ' trong ' + page.totalElements"></span>
            <div class="pages">
                <a class="page-link"
                   th:classappend="${page.first} ? 'is-disabled'"
                   th:href="@{/admin/profiles/students(page=${page.number - 1})}">&larr; Trước</a>
                <a class="page-link"
                   th:each="n : ${#numbers.sequence(
                        page.number <= 4 ? 0 : page.number - 4,
                        page.totalPages - 5 <= page.number ? page.totalPages - 1 : page.number + 4)}"
                   th:classappend="${page.number == n} ? 'is-current'"
                   th:href="@{/admin/profiles/students(page=${n})}"
                   th:text="${n + 1}">1</a>
                <a class="page-link"
                   th:classappend="${page.last} ? 'is-disabled'"
                   th:href="@{/admin/profiles/students(page=${page.number + 1})}">Sau &rarr;</a>
            </div>
        </nav>
    </div>
</main>

</body>
</html>
