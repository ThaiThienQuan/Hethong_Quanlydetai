<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ sinh viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="box xwide">
        <h2>Hồ sơ sinh viên</h2>
        <a th:href="@{/}">&larr; Về trang chủ</a>

        <p class="ok" th:if="${message}" th:text="${message}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã SV</th>
                        <th>Họ tên</th>
                        <th>Lớp</th>
                        <th>Ngành</th>
                        <th>Email</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s, stat : ${students}">
                        <td th:text="${stat.count}">1</td>
                        <td><code th:text="${s.studentCode}">SV001</code></td>
                        <td th:text="${s.user.fullName}">Nguyễn Văn B</td>
                        <td th:text="${s.className}">CNTT-K63</td>
                        <td th:text="${s.major}">Công nghệ thông tin</td>
                        <td th:text="${s.user.email != null ? s.user.email : '—'}">email@edu.vn</td>
                        <td class="actions">
                            <a th:href="@{/admin/profiles/students/{id}(id=${s.id})}">Xem</a>
                            <a th:href="@{/admin/profiles/students/{id}/edit(id=${s.id})}">Sửa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7">Chưa có hồ sơ sinh viên nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
