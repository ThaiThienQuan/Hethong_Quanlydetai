<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sửa hồ sơ giảng viên')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box narrow">
        <div class="box-head">
            <h2>Sửa hồ sơ giảng viên</h2>
            <div class="box-head-actions">
                <a class="back-link" th:href="@{/admin/profiles/lecturers}">&larr; Quay lại danh sách</a>
            </div>
        </div>

        <form th:action="@{/admin/profiles/lecturers/{id}/edit(id=${lecturer.id})}" method="post">
            <div class="form-group">
                <label>Mã giảng viên</label>
                <input type="text" th:value="${lecturer.lecturerCode}" disabled>
            </div>

            <div class="form-group">
                <label for="fullName">Họ tên</label>
                <input type="text" id="fullName" name="fullName" th:value="${lecturer.user.fullName}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${lecturer.user.email != null ? lecturer.user.email : ''}">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="text" id="phone" name="phone" th:value="${lecturer.user.phone != null ? lecturer.user.phone : ''}">
            </div>

            <div class="form-group">
                <label for="academicDegree">Học vị</label>
                <input type="text" id="academicDegree" name="academicDegree" 
                       th:value="${lecturer.academicDegree != null ? lecturer.academicDegree : ''}"
                       placeholder="VD: Thạc sĩ, Tiến sĩ">
            </div>

            <div class="form-group">
                <label for="departmentId">Bộ môn</label>
                <select id="departmentId" name="departmentId" required>
                    <option th:each="d : ${departments}" th:value="${d.id}" 
                            th:text="${d.name}"
                            th:selected="${lecturer.department != null and lecturer.department.id == d.id}"></option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn primary">💾 Lưu thay đổi</button>
                <a th:href="@{/admin/profiles/lecturers}" class="btn secondary">Hủy</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
