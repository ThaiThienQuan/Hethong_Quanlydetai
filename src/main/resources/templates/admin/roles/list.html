<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý vai trò')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
        <div class="box-head">
            <h2>Quản lý vai trò</h2>
            <div class="box-head-actions">
                <a class="btn btn-primary" th:href="@{/roles/new}">
                    <svg class="ui-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    Tạo vai trò mới
                </a>
            </div>
        </div>

        <p class="ok" th:if="${message}" th:text="${message}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng vai trò">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã vai trò</th>
                        <th>Tên vai trò</th>
                        <th>Mô tả</th>
                        <th>Số quyền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r, stat : ${roles}">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <code th:text="${r.code}">ADMIN</code>
                            <span th:if="${r.system}" class="badge st-sys" title="Vai trò hệ thống, không xóa được">Hệ thống</span>
                        </td>
                        <td th:text="${r.name}">Quản trị viên</td>
                        <td th:text="${r.description != null ? r.description : '—'}">Mô tả</td>
                        <td th:text="${r.permissions.size()}">5</td>
                        <td class="actions">
                            <a class="btn btn-soft-primary btn-sm" th:href="@{/roles/{id}/permissions(id=${r.id})}">Phân quyền</a>
                            <a class="btn btn-soft-primary btn-sm" th:href="@{/roles/{id}/edit(id=${r.id})}" th:if="${!r.system}">Sửa</a>
                            <form th:action="@{/roles/{id}/delete(id=${r.id})}" method="post"
                                  data-confirm-message="Xóa vai trò này? Người dùng đang dùng vai trò này sẽ mất quyền tương ứng."
                                  th:if="${!r.system}">
                                <button class="btn btn-soft-danger btn-sm" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="6">Chưa có vai trò nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
