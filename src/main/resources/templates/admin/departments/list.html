<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý bộ môn</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="box wide">
        <h2>Quản lý bộ môn</h2>
        <a th:href="@{/}">&larr; Về trang chủ</a>
        <a class="btn" th:href="@{/admin/departments/new}">+ Thêm bộ môn</a>

        <p class="ok" th:if="${message}" th:text="${message}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <div class="table-scroll" role="region" tabindex="0">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã</th>
                        <th>Tên bộ môn</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d, stat : ${departments}">
                        <td th:text="${stat.count}">1</td>
                        <td><code th:text="${d.code}">CNTT</code></td>
                        <td th:text="${d.name}">Công nghệ thông tin</td>
                        <td th:text="${d.description != null ? d.description : '—'}">Mô tả</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${d.status == 'ACTIVE' ? 'st-active' : 'st-inactive'}"
                                  th:text="${d.status == 'ACTIVE' ? 'Hoạt động' : 'Không hoạt động'}">
                                Hoạt động
                            </span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/admin/departments/{id}/edit(id=${d.id})}">Sửa</a>
                            <form th:action="@{/admin/departments/{id}/toggle(id=${d.id})}" method="post" style="display:inline">
                                <button type="submit" th:text="${d.status == 'ACTIVE'} ? 'Hủy' : 'Kích hoạt'">Đổi</button>
                            </form>
                            <form th:action="@{/admin/departments/{id}/delete(id=${d.id})}" method="post"
                                  onsubmit="return confirm('Xóa vĩnh viễn bộ môn này?');" style="display:inline">
                                <button type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(departments)}">
                        <td colspan="6">Chưa có bộ môn nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
