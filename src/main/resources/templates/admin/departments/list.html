<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý bộ môn')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box wide">
        <div class="box-head">
            <h2>Quản lý bộ môn</h2>
            <div class="box-head-actions">
                <a class="btn btn-primary" th:href="@{/admin/departments/new}">
                    <svg class="ui-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    Thêm bộ môn
                </a>
            </div>
        </div>

        <p class="ok" th:if="${message}" th:text="${message}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <div class="table-scroll" role="region" tabindex="0">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã</th>
                        <th>Tên bộ môn</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d, stat : ${departments}">
                        <td th:text="${stat.count}">1</td>
                        <td><code th:text="${d.code}">CNTT</code></td>
                        <td th:text="${d.name}">Công nghệ thông tin</td>
                        <td th:text="${d.description != null ? d.description : '—'}">Mô tả</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${d.status == 'ACTIVE' ? 'st-active' : 'st-inactive'}"
                                  th:text="${d.status == 'ACTIVE' ? 'Hoạt động' : 'Không hoạt động'}">
                                Hoạt động
                            </span>
                        </td>
                        <td class="actions">
                            <a class="btn btn-soft-primary btn-sm" th:href="@{/admin/departments/{id}/edit(id=${d.id})}">Sửa</a>
                            <form th:action="@{/admin/departments/{id}/toggle(id=${d.id})}" method="post" class="form-inline">
                                <button class="btn btn-sm" type="submit"
                                        th:classappend="${d.status == 'ACTIVE'} ? 'btn-soft-warning' : 'btn-soft-success'"
                                        th:text="${d.status == 'ACTIVE'} ? 'Hủy' : 'Kích hoạt'">Đổi</button>
                            </form>
                            <form th:action="@{/admin/departments/{id}/delete(id=${d.id})}" method="post"
                                  onsubmit="return confirm('Xóa vĩnh viễn bộ môn này?');" class="form-inline">
                                <button class="btn btn-soft-danger btn-sm" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(departments)}">
                        <td colspan="6">Chưa có bộ môn nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
