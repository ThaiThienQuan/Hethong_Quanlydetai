<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="box xwide">
    <h2>Quản lý tài khoản</h2>
    <a th:href="@{/}">&larr; Về trang chủ</a>
    <a class="btn" th:href="@{/admin/users/new}">+ Tạo tài khoản</a>

    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table>
        <thead>
            <tr><th>#</th><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Mã SV/GV</th>
                <th>Bộ môn</th><th>Email</th><th>Trạng thái</th><th>Thao tác</th></tr>
        </thead>
        <tbody>
            <tr th:each="u, stat : ${users}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${u.username}">user</td>
                <td th:text="${u.fullName != null ? u.fullName : ''}">Họ tên</td>
                <td th:text="${u.role != null ? u.role.label : '—'}">Vai trò</td>
                <td th:text="${u.studentCode != null ? u.studentCode : (u.lecturerCode != null ? u.lecturerCode : '')}">Mã</td>
                <td th:text="${u.department != null ? u.department.name : ''}">Bộ môn</td>
                <td th:text="${u.email != null ? u.email : ''}">Email</td>
                <td>
                    <span class="badge"
                          th:classappend="${u.status != null ? 'st-' + u.status.name() : ''}"
                          th:text="${u.status != null ? u.status.label : '—'}">Hoạt động</span>
                </td>
                <td class="actions">
                    <a th:href="@{/admin/users/{id}/edit(id=${u.id})}">Sửa</a>
                    <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                        <button type="submit"
                                th:text="${u.status != null and u.status.name() == 'ACTIVE'} ? 'Khóa' : 'Mở khóa'">Khóa</button>
                    </form>
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                          onsubmit="return confirm('Xóa vĩnh viễn tài khoản này? Nếu tài khoản đã gắn với dữ liệu, hệ thống sẽ từ chối xóa.');">
                        <button type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="9">Chưa có tài khoản nào.</td>
            </tr>
        </tbody>
    </table></div>
</div>
</body>
</html>
