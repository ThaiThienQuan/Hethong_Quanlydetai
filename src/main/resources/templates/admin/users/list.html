<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý tài khoản')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
    <div class="box-head">
        <h2>Quản lý tài khoản</h2>
        <div class="box-head-actions">
            <a class="btn btn-primary" th:href="@{/admin/users/new}">
                <svg class="ui-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Tạo tài khoản
            </a>
        </div>
    </div>

    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <!-- Tìm kiếm + lọc vai trò/trạng thái + phân trang (mục 5.1) -->
    <form method="get" th:action="@{/admin/users}" class="filter-bar">
        <label>Tìm kiếm</label>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tên đăng nhập, họ tên, email">
        <label>Vai trò</label>
        <select name="role">
            <option value="">-- Tất cả --</option>
            <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}"
                    th:selected="${selectedRole == r.name()}"></option>
        </select>
        <label>Trạng thái</label>
        <select name="status">
            <option value="">-- Tất cả --</option>
            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                    th:selected="${selectedStatus == s.name()}"></option>
        </select>
        <button class="btn btn-secondary btn-sm" type="submit">Lọc</button>
    </form>

    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table class="table-wide">
        <thead>
            <tr><th>#</th><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Mã SV/GV</th>
                <th>Email</th><th>Trạng thái</th><th>Thao tác</th></tr>
        </thead>
        <tbody>
            <tr th:each="u, stat : ${users}">
                <td th:text="${stat.count}">1</td>
                <td class="nowrap" th:text="${u.username}">user</td>
                <td class="nowrap" th:text="${u.fullName != null ? u.fullName : ''}">Họ tên</td>
                <td class="nowrap" th:text="${u.role != null ? u.role.label : '—'}">Vai trò</td>
                <td class="nowrap" th:text="${u.studentCode != null ? u.studentCode : (u.lecturerCode != null ? u.lecturerCode : '')}">Mã</td>
                <td class="nowrap" th:text="${u.email != null ? u.email : ''}">Email</td>
                <td>
                    <span class="badge"
                          th:classappend="${u.status != null ? 'st-' + u.status.name() : ''}"
                          th:text="${u.status != null ? u.status.label : '—'}">Hoạt động</span>
                    <span class="badge st-OVERDUE" th:if="${u.temporarilyLocked}">Tạm khóa (đăng nhập sai)</span>
                </td>
                <td class="actions">
                    <a class="btn btn-soft-primary btn-sm" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Sửa</a>
                    <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                        <button class="btn btn-sm" type="submit"
                                th:classappend="${u.status != null and u.status.name() == 'ACTIVE'} ? 'btn-soft-warning' : 'btn-soft-success'"
                                th:text="${u.status != null and u.status.name() == 'ACTIVE'} ? 'Khóa' : 'Mở khóa'">Khóa</button>
                    </form>
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                          data-confirm-message="Xóa vĩnh viễn tài khoản này? Nếu tài khoản đã gắn với dữ liệu, hệ thống sẽ từ chối xóa.">
                        <button class="btn btn-soft-danger btn-sm" type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="9">Không tìm thấy tài khoản nào.</td>
            </tr>
        </tbody>
    </table></div>

    <p th:if="${page != null and page.totalPages > 1}" class="u-mt-4">
        <span th:text="'Trang ' + ${page.number + 1} + '/' + ${page.totalPages}"></span>
        <a th:if="${page.hasPrevious()}"
           th:href="@{/admin/users(keyword=${keyword},role=${selectedRole},status=${selectedStatus},page=${page.number})}">&larr; Trước</a>
        <a th:if="${page.hasNext()}"
           th:href="@{/admin/users(keyword=${keyword},role=${selectedRole},status=${selectedStatus},page=${page.number + 2})}">Sau &rarr;</a>
    </p>
</div>
</main>

</body>
</html>
