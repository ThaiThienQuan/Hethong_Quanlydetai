<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box formbox">
    <div class="box-head">
        <h2 th:text="${pageTitle}">Tài khoản</h2>
        <div class="box-head-actions">
            <a class="back-link" th:href="@{/admin/users}">&larr; Về danh sách</a>
        </div>
    </div>

    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <!-- data-editing: khi SỬA thì các ô hồ sơ không bắt buộc (dữ liệu cũ có thể thiếu) -->
    <form th:action="@{${action}}" th:object="${userForm}" method="post"
          th:attr="data-editing=${editing}">

        <label>Tên đăng nhập</label>
        <!-- Khi SỬA (editing = true): chỉ xem, không đổi được -->
        <input type="text" th:field="*{username}" th:readonly="${editing}">
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <label>Mật khẩu <small th:if="${editing}">(để trống nếu không đổi)</small></label>
        <input type="password" th:field="*{password}" autocomplete="new-password">
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label>Họ tên</label>
        <input type="text" th:field="*{fullName}">
        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label>Số điện thoại</label>
        <input type="text" th:field="*{phone}">
        <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

        <label>Vai trò</label>
        <!-- Tạo mới: chọn vai trò. Sửa: hiển thị chữ + ô ẩn giữ giá trị (Service bỏ qua giá trị này khi sửa) -->
        <select th:if="${!editing}" th:field="*{role}">
            <option value="">-- Chọn vai trò --</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}">Vai trò</option>
        </select>
        <div th:if="${editing}">
            <strong th:text="${userForm.role.label}">Vai trò</strong>
            <input type="hidden" th:field="*{role}">
        </div>
        <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>

        <!-- ======= HỒ SƠ THEO VAI TRÒ =======
             Mỗi nhóm ô gắn data-roles="..." (danh sách mã vai trò được phép hiện).
             ui.js ẩn/hiện nhóm tương ứng với vai trò đang chọn trong ô "Vai trò".
             Khi SỬA, vai trò không đổi được và hồ sơ SV/GV được quản lý ở màn hình
             "Hồ sơ sinh viên / Hồ sơ giảng viên" nên các nhóm ô này đều ẩn. -->
        <div class="form-profile-group" data-roles="SINH_VIEN" hidden>
            <label>Mã sinh viên</label>
            <input type="text" id="studentCodePreview" th:value="${nextStudentCode}" readonly
                   placeholder="Hệ thống sẽ cấp mã khi lưu">

            <label>Lớp</label>
            <input type="text" th:field="*{className}" placeholder="Ví dụ: IT17201">
            <div class="field-error" th:if="${#fields.hasErrors('className')}" th:errors="*{className}"></div>

            <label>Ngành học</small></label>
            <input type="text" th:field="*{major}" placeholder="Ví dụ: Hệ thống thông tin">
            <div class="field-error" th:if="${#fields.hasErrors('major')}" th:errors="*{major}"></div>
        </div>

        <div class="form-profile-group" data-roles="GIANG_VIEN,TRUONG_KHOA" hidden>
            <label>Mã giảng viên</small></label>
            <input type="text" id="lecturerCodePreview" th:value="${nextLecturerCode}" readonly
                   placeholder="Hệ thống sẽ cấp mã khi lưu">

            <label>Bộ môn</small></label>
            <select th:field="*{departmentId}">
                <option value="">-- Chọn bộ môn --</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}">Bộ môn</option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Lưu</button>
    </form>

    <!-- ============ Khi SỬA: đặt lại mật khẩu & gán vai trò (mục 5.1) ============ -->
    <div th:if="${editing}" class="form-section">
        <h3>Thao tác quản trị</h3>

        <form th:action="@{/admin/users/{id}/reset-password(id=${userId})}" method="post"
              data-confirm-message="Đặt lại mật khẩu tài khoản này về mật khẩu mặc định?">
            <label>Đặt lại mật khẩu</label>
            <button class="btn btn-secondary" type="submit">Đặt lại</button>
        </form>

        <form th:action="@{/admin/users/{id}/assign-role(id=${userId})}" method="post">
            <label>Gán lại vai trò</label>
            <select name="role" required>
                <option value="">-- Chọn vai trò --</option>
                <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}"></option>
            </select>
            <button class="btn btn-secondary" type="submit">Gán vai trò</button>
        </form>
    </div>
</div>
</main>

</body>
</html>
