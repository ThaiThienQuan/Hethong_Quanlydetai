<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Khoa CNTT</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/security-module.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-brand">
        <span class="login-mark">Cổng thông tin nội bộ</span>
        <div><h1>Khoa CNTT</h1><p>Hệ thống quản lý tài khoản và thông báo của khoa.</p></div>
    </section>
    <section class="login-content">
        <h2>Đăng nhập</h2>
        <p>Sử dụng tài khoản được cấp để tiếp tục.</p>
        <div class="alert error" th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng.</div>
        <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất thành công.</div>
        <form class="login-form" th:action="@{/login}" method="post">
            <label for="username">Tên đăng nhập</label>
            <input id="username" name="username" type="text" required autocomplete="username">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
            <button type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
</body>
</html>
