<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
  UniResearch – khung trang duy nhất (sidebar + topbar).
  Nội dung chi tiết nằm trong <main class="app-main"> của từng template.
  Fragment gốc: fragments/layout.html :: nav
  File này chỉ làm "bộ chuyển tiếp" để các trang có thể gọi
  <div th:replace="~{fragments/nav :: nav}"></div> mà không phụ thuộc layout.html.
-->
<th:block th:fragment="nav">
  <div th:replace="~{fragments/layout :: nav}"></div>
</th:block>
</body>
</html>
