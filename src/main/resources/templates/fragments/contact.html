<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  UniResearch – khối thông tin liên hệ quản trị viên, dùng lại ở nhiều trang.
  Biến ${supportContact} do GlobalModelAttributes cấp sẵn cho MỌI template,
  nên fragment dùng được cả ở trang đăng nhập (permitAll).
  Dùng: <div th:replace="~{fragments/contact :: contact}"></div>
-->
<th:block th:fragment="contact">
  <div class="contact-card" th:if="${supportContact != null}">
    <div class="contact-head">
      <span class="contact-avatar" aria-hidden="true">
        <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      <div>
        <strong class="contact-title" th:text="${supportContact.adminFullName != null ? supportContact.adminFullName : 'Quản trị viên hệ thống'}">Quản trị viên hệ thống</strong>
        <span class="contact-unit" th:text="${supportContact.unitName}">Khoa Công nghệ Thông tin</span>
      </div>
    </div>

    <ul class="contact-list">
      <li th:if="${supportContact.phone != null and !supportContact.phone.isBlank()}">
        <span class="contact-label">
          <svg class="ui-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
          <span>Điện thoại</span>
        </span>
        <a class="contact-value" th:href="'tel:' + ${supportContact.phone}" th:text="${supportContact.phone}">0900000001</a>
      </li>
      <li th:if="${supportContact.email != null and !supportContact.email.isBlank()}">
        <span class="contact-label">
          <svg class="ui-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 7.5 9 6 9-6"/></svg>
          <span>Email</span>
        </span>
        <a class="contact-value" th:href="'mailto:' + ${supportContact.email}" th:text="${supportContact.email}">admin@demo.local</a>
      </li>
      <li th:if="${supportContact.address != null and !supportContact.address.isBlank()}">
        <span class="contact-label">
          <svg class="ui-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>Địa chỉ</span>
        </span>
        <span class="contact-value" th:text="${supportContact.address}">Phòng Hành chính</span>
      </li>
      <li th:if="${supportContact.officeHours != null and !supportContact.officeHours.isBlank()}">
        <span class="contact-label">
          <svg class="ui-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Giờ làm việc</span>
        </span>
        <span class="contact-value" th:text="${supportContact.officeHours}">Sáng: 8:00 - 11:30</span>
      </li>
    </ul>

    <p class="contact-note" th:if="${supportContact.instruction != null and !supportContact.instruction.isBlank()}"
       th:text="${supportContact.instruction}">Vui lòng cung cấp tên đăng nhập.</p>
  </div>
</th:block>
</body>
</html>
