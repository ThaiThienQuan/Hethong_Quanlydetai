<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý thông báo')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
    <div class="box-head">
        <h2>Quản lý thông báo</h2>
        <div class="box-head-actions">
            <a class="back-link" th:href="@{/announcements}">Xem thông báo đã đăng</a>
        </div>
    </div>
    <p class="ok" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
    <h3>Tạo thông báo nháp</h3>
    <form th:action="@{${managePath}}" th:object="${announcementForm}" method="post">
        <label>Tiêu đề</label><input th:field="*{title}" maxlength="500" required><div class="field-error" th:errors="*{title}"></div>
        <label>Nội dung</label><textarea th:field="*{content}" rows="5" required></textarea><div class="field-error" th:errors="*{content}"></div>
        <label>Phạm vi</label><select th:field="*{scope}" required><option th:each="scope : ${scopeOptions}" th:value="${scope}" th:text="${scope}"></option></select>
        <button class="btn btn-primary" type="submit">Lưu nháp</button>
    </form>
    <h3>Thông báo của tôi</h3>
    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table><thead><tr><th>Tiêu đề</th><th>Phạm vi</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead>
        <tbody><tr th:each="a : ${announcements}"><td th:text="${a.title}"></td><td th:text="${a.scope + (a.departmentName != null ? ' — ' + a.departmentName : '')}"></td>
            <td th:text="${a.status}"></td><td th:text="${a.createdAt != null ? #temporals.format(a.createdAt, 'dd/MM/yyyy HH:mm') : ''}"></td>
            <td><span th:if="${a.status == 'DRAFT'}"><a class="btn btn-soft-primary btn-sm" th:href="@{${managePath} + '/' + ${a.id} + '/edit'}">Sửa</a> <form th:action="@{${managePath} + '/' + ${a.id} + '/delete'}" method="post" class="form-inline" onsubmit="return confirm('Xóa thông báo nháp này?');"><button class="btn btn-soft-danger btn-sm" type="submit">Xóa</button></form> <form th:action="@{${managePath} + '/' + ${a.id} + '/publish'}" method="post" class="form-inline"><button class="btn btn-soft-success btn-sm" type="submit">Công bố</button></form></span><span th:unless="${a.status == 'DRAFT'}">Đã công bố</span></td>
        </tr><tr th:if="${#lists.isEmpty(announcements)}"><td colspan="5">Bạn chưa tạo thông báo nào.</td></tr></tbody>
    </table></div>
</div>
</main>

</body>
</html>
