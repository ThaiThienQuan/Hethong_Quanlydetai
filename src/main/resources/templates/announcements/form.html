<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box formbox">
    <div class="box-head">
        <h2 th:text="${pageTitle}">Sửa thông báo</h2>
        <div class="box-head-actions">
            <a class="back-link" th:href="@{${backUrl}}">← Quay lại quản lý thông báo</a>
        </div>
    </div>
    <form th:action="@{${action}}" th:object="${announcementForm}" method="post">
        <label>Tiêu đề</label>
        <input th:field="*{title}" maxlength="500" required>
        <div class="field-error" th:errors="*{title}"></div>
        <label>Nội dung</label>
        <textarea th:field="*{content}" rows="8" required></textarea>
        <div class="field-error" th:errors="*{content}"></div>
        <label>Phạm vi</label>
        <select th:field="*{scope}" required>
            <option th:each="scope : ${scopeOptions}" th:value="${scope}" th:text="${scope}"></option>
        </select>
        <div class="field-error" th:errors="*{scope}"></div>
        <button class="btn btn-primary" type="submit">Lưu thông báo</button>
    </form>
</div>
</main>

</body>
</html>
