<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ cá nhân | Khoa CNTT</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/security-module.css}">
</head>
<body>
<main class="page-shell">
    <header class="topbar-card">
        <div><div class="crumb">Tài khoản / cá nhân</div><h1>Hồ sơ của tôi</h1></div>
        <div class="topbar-actions"><a th:href="@{/}">Tổng quan</a></div>
    </header>
    <div class="notice" th:if="${message}" th:text="${message}"></div>
    <div class="profile-layout">
        <section class="panel profile-panel">
            <h2>Thông tin tài khoản</h2>
            <div class="profile-summary">
                <p><strong>Tên đăng nhập:</strong> <span th:text="${user.username}">username</span></p>
                <p><strong>Nhóm:</strong>
                    <span class="role-list"><span class="role-chip" th:each="role : ${user.roles}" th:text="${role.name}">SINH_VIEN</span></span>
                </p>
                <p><strong>Trạng thái:</strong> <span class="status-badge status-active" th:text="${user.status}">ACTIVE</span></p>
            </div>
            <form th:action="@{/users/profile}" method="post" class="form-grid">
                <div class="field full">
                    <label for="fullName">Họ và tên</label>
                    <input id="fullName" name="fullName" th:value="${user.fullName}" required maxlength="100" autocomplete="name">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" th:value="${user.email}" required maxlength="120" autocomplete="email">
                </div>
                <div class="field">
                    <label for="phone">Số điện thoại</label>
                    <input id="phone" name="phone" type="tel" th:value="${user.phone}" maxlength="20" autocomplete="tel">
                </div>
                <div class="field full form-actions"><button class="primary-btn" type="submit">Lưu hồ sơ</button></div>
            </form>
        </section>
        <section class="panel profile-panel">
            <h2>Đổi mật khẩu</h2>
            <form th:action="@{/users/profile/password}" method="post" class="login-form">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password">
                <label for="newPassword">Mật khẩu mới</label>
                <input id="newPassword" name="newPassword" type="password" required minlength="8" autocomplete="new-password">
                <button type="submit">Cập nhật mật khẩu</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
