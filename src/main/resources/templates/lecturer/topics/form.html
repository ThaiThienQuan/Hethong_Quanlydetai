<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box formbox">
    <div class="box-head">
        <h2 th:text="${pageTitle}">Đề xuất đề tài</h2>
        <div class="box-head-actions">
            <a class="back-link" th:href="@{/lecturer/topics}">&larr; Về danh sách</a>
        </div>
    </div>

    <p class="error" th:if="${#lists.isEmpty(periods)}">
        Hiện chưa có đợt đăng ký nào đang mở cho giảng viên.
    </p>

    <form th:action="@{${action}}" th:object="${topicForm}" method="post">

        <label>Tên đề tài <span class="required">*</span></label>
        <input type="text" th:field="*{topicName}" maxlength="200" required>
        <div class="field-error" th:if="${#fields.hasErrors('topicName')}" th:errors="*{topicName}"></div>

        <label>Mô tả nội dung <span class="required">*</span>
            <small>(tối thiểu 20 ký tự)</small></label>
        <textarea th:field="*{description}" rows="5" maxlength="5000" required></textarea>
        <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>

        <label>Bộ môn <span class="required">*</span></label>
        <div th:if="${myDepartment != null}">
            <input type="hidden" th:field="*{departmentId}">
            <input type="text" th:value="${myDepartment.name()}" readonly
                   class="input-readonly" tabindex="-1">
        </div>
        <select th:if="${myDepartment == null}" th:field="*{departmentId}" required>
            <option value="">-- Chọn bộ môn --</option>
            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}">Bộ môn</option>
        </select>
        <div class="field-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>

        <label>Đợt đăng ký <span class="required">*</span></label>
        <select th:field="*{periodId}" required>
            <option value="">-- Chọn đợt --</option>
            <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name}">Đợt</option>
        </select>
        <div class="field-error" th:if="${#fields.hasErrors('periodId')}" th:errors="*{periodId}"></div>

        <label>GVHD thứ hai</label>
        <select th:field="*{coSupervisorId}">
            <option value="">-- Không có --</option>
            <option th:each="l : ${lecturers}" th:value="${l.id}" th:text="${l.fullName}">Giảng viên</option>
        </select>
        <div class="field-error" th:if="${#fields.hasErrors('coSupervisorId')}" th:errors="*{coSupervisorId}"></div>

        <button class="btn btn-primary" type="submit">Gửi đề tài</button>
    </form>
</div>
</main>

<!-- Xem trước mã đề tài sắp được cấp.
     Bỗ Môn là cố định theo GV nên chỉ cần đổi Đợt đăng ký là mã đổi theo. -->
<script th:if="${!editing}" th:inline="javascript">
    (function () {
        var periodSelect = document.getElementById('periodId');
        var deptInput = document.getElementById('departmentId');
        var preview = document.getElementById('previewCode');
        var url = /*[[@{/lecturer/topics/preview-code}]]*/ '';

        function refresh() {
            var periodId = periodSelect ? periodSelect.value : '';
            var deptId = deptInput ? deptInput.value : '';
            if (!periodId || !deptId) {
                preview.value = '';
                preview.placeholder = 'Chọn Bỗ Môn và Đợt đăng ký để xem mã';
                return;
            }
            fetch(url + '?departmentId=' + encodeURIComponent(deptId)
                       + '&periodId=' + encodeURIComponent(periodId),
                  { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(function (r) { return r.ok ? r.text() : ''; })
                .then(function (code) {
                    preview.value = (code || '').trim();
                    if (!code) preview.placeholder = 'Không xem trước được mã, hệ thống sẽ tự cấp khi gửi';
                })
                .catch(function () { preview.placeholder = 'Không xem trước được mã, hệ thống sẽ tự cấp khi gửi'; });
        }

        if (periodSelect) periodSelect.addEventListener('change', refresh);
        refresh();
    })();
</script>

</body>
</html>
