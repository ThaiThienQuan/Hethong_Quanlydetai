<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đề tài của tôi')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
    <div class="box-head">
        <h2>Đề tài của tôi</h2>
        <div class="box-head-actions">
            <a class="btn btn-primary" th:href="@{/lecturer/topics/new}">
                <svg class="ui-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                Đăng ký đề tài mới
            </a>
        </div>
    </div>

    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table>
        <thead>
            <tr><th>#</th><th>Mã</th><th>Tên đề tài</th><th>Bộ môn</th><th>Đợt</th><th>GVHD</th>
                <th>Trạng thái</th><th>Lý do từ chối</th><th>Thao tác</th></tr>
        </thead>
        <tbody>
            <!-- "rows" là danh sách TopicView do Controller đưa vào; row.topic là đề tài, row.supervisors là tên các GVHD -->
            <tr th:each="row, stat : ${rows}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${row.topicCode}">Mã</td>
                <td th:text="${row.topicName}">Tên đề tài</td>
                <td th:text="${row.departmentName}">Bộ môn</td>
                <td th:text="${row.periodName}">Đợt</td>
                <td th:text="${row.supervisorsText}">GVHD</td>
                <td>
                    <span class="badge" th:classappend="${row.status != null ? 'st-' + row.status.name() : ''}"
                          th:text="${
                              row.status == null ? '—' :
                              row.status.name() == 'PENDING' ? 'Chờ duyệt' :
                              row.status.name() == 'APPROVED' ? 'Đã duyệt' :
                              row.status.name() == 'REJECTED' ? 'Bị từ chối' : row.status.name()}">Chờ duyệt</span>
                </td>
                <td th:text="${row.rejectReason}"></td>
                <td class="actions">
                    <a th:if="${row.editable}" th:href="@{/lecturer/topics/{id}/edit(id=${row.id})}">Sửa</a>
                    <form th:if="${row.editable}" th:action="@{/lecturer/topics/{id}/delete(id=${row.id})}" method="post" class="form-inline"
                          data-confirm-message="Bạn chắc chắn muốn xóa đề tài này?">
                        <button class="btn btn-soft-danger btn-sm" type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="9">Bạn chưa có đề tài nào.</td></tr>
        </tbody>
    </table></div>
</div>
</main>

</body>
</html>
