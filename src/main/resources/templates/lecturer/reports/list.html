<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Báo cáo đề tài được hướng dẫn</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="box xwide">
    <h2>Báo cáo của nhóm được hướng dẫn</h2>
    <a th:href="@{/}">← Về trang chủ</a>
    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table>
        <thead><tr><th>Nhóm</th><th>Đề tài</th><th>Tệp báo cáo</th><th>Tải xuống</th></tr></thead>
        <tbody>
        <tr th:each="report : ${reports}">
            <td th:text="${report.groupName}"></td>
            <td th:text="${report.topicTitle}"></td>
            <td th:text="${report.fileName}"></td>
            <td>
                <a th:if="${report.downloadAvailable}" th:href="@{/lecturer/reports/{id}/download(id=${report.registrationId})}">Tải báo cáo</a>
                <span th:if="${!report.downloadAvailable}">Tệp không còn trong kho lưu trữ</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reports)}"><td colspan="4">Chưa có nhóm được hướng dẫn nào nộp báo cáo.</td></tr>
        </tbody>
    </table></div>
</div>
</body>
</html>
