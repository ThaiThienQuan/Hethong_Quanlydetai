<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Duyệt đăng ký nhóm')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
    <div class="box-head">
        <h2>Duyệt đăng ký nhóm</h2>
    </div>

    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu">
        <table>
            <thead>
            <tr>
                <th>Nhóm</th>
                <th>Nhóm trưởng</th>
                <th>Thành viên</th>
                <th>Đề tài</th>
                <th>Bộ môn</th>
                <th>Đợt</th>
                <th>Ngày đăng ký</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reg : ${registrations}">
                <td>
                    <strong th:text="${reg.groupName}">Nhóm</strong>
                </td>
                <td th:text="${reg.leaderName}">Nhóm trưởng</td>
                <td>
                    <th:block th:each="m : ${reg.members}">
                        <span th:text="${m.fullName}">Thành viên</span><br>
                    </th:block>
                </td>
                <td>
                    <strong th:text="${reg.topicTitle}">Đề tài</strong>
                    <div class="desc" th:text="${reg.topicDescription}">Mô tả</div>
                </td>
                <td th:text="${reg.departmentName}">Bộ môn</td>
                <td th:text="${reg.periodName}">Đợt</td>
                <td th:text="${#temporals.format(reg.registeredAt, 'dd/MM/yyyy HH:mm')}">Ngày</td>
                <td class="actions">
                    <form th:action="@{/lecturer/registrations/{id}/approve(id=${reg.id})}" method="post">
                        <button class="btn btn-soft-success btn-sm" type="submit" onclick="return confirm('Bạn chắc chắn chấp thuận nhóm này được đăng ký đề tài?');">Chấp thuận</button>
                    </form>
                    <form th:action="@{/lecturer/registrations/{id}/reject(id=${reg.id})}" method="post">
                        <input type="text" name="reason" placeholder="Lý do từ chối" class="reason" required>
                        <button class="btn btn-soft-danger btn-sm" type="submit" onclick="return confirm('Bạn chắc chắn từ chối đăng ký này?');">Từ chối</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(registrations)}">
                <td colspan="8">Không có đăng ký nào đang chờ xác nhận.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</main>

</body>
</html>
