<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý vai trò</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/security-module.css}">
</head>
<body>
<div class="page-shell">
    <div class="topbar-card">
        <div>
            <div class="crumb">Quản trị hệ thống / vai trò</div>
            <h1>Nhóm người dùng</h1>
        </div>
        <div class="topbar-actions">
            <a th:href="@{/roles/new}">Thêm vai trò</a>
            <a th:href="@{/}">Dashboard</a>
        </div>
    </div>

    <section class="table-card panel">
        <div class="table-header">
            <h2>Danh sách vai trò</h2>
        </div>
        <div class="table-scroll"><table class="data-table">
            <thead>
            <tr>
                <th>Tên vai trò</th>
                <th>Mô tả</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="role : ${roles}">
                <td><span class="role-chip" th:text="${role.name}">TRUONG_KHOA</span></td>
                <td th:text="${role.description != null ? role.description : 'Chưa cập nhật'}">Mô tả</td>
                <td>
                    <a class="secondary-btn" th:href="@{/roles/{id}(id=${role.id})}">Chi tiết</a>
                    <a class="ghost-btn" th:href="@{/roles/{id}/edit(id=${role.id})}">Sửa</a>
                </td>
            </tr>
            </tbody>
        </table></div>
    </section>
</div>
</body>
</html>
