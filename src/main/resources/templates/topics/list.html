<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách đề tài')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box wide">
    <div class="box-head">
        <h2>Danh sách đề tài đã công bố</h2>
    </div>

    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table>
        <thead>
            <tr><th>#</th><th>Tên đề tài</th><th>Bộ môn</th><th>Người tạo</th><th>Ngày tạo</th></tr>
        </thead>
        <tbody>
            <!-- th:each lặp qua danh sách "topics" mà Controller đã đưa vào Model -->
            <tr th:each="t, stat : ${topics}">
                <td th:text="${stat.count}">1</td>
                <td>
                    <strong th:text="${t.topicName}">Tên đề tài</strong>
                    <div class="muted" th:text="${t.topicCode}">Mã đề tài</div>
                </td>
                <td th:text="${t.departmentName}">Bộ môn</td>
                <td th:text="${t.createdByLecturerName}">GV</td>
                <td th:text="${t.createdAt != null ? #temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">Ngày tạo</td>
            </tr>
            <tr th:if="${#lists.isEmpty(topics)}">
                <td colspan="5">Chưa có đề tài nào được công bố.</td>
            </tr>
        </tbody>
    </table></div>
</div>
</main>

</body>
</html>
