<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đợt đăng ký')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box formbox">
    <div class="box-head">
        <h2 th:text="${editing} ? 'Sửa đợt đăng ký nháp' : 'Tạo đợt đăng ký'">Đợt đăng ký</h2>
        <div class="box-head-actions">
            <a class="back-link" th:href="@{/periods}">&larr; Về danh sách</a>
        </div>
    </div>
    <form th:action="${editing} ? @{/periods/{id}/edit(id=${periodId})} : @{/periods/new}" th:object="${periodForm}" method="post">
        <label>Tên đợt</label><input th:field="*{name}" required>
        <div class="field-error" th:errors="*{name}"></div>
        <label>Loại đợt</label>
        <select th:field="*{type}" required><option value="">-- Chọn loại --</option><option th:each="t : ${periodTypes}" th:value="${t}" th:text="${t.displayName}"></option></select>
        <div class="field-error" th:errors="*{type}"></div>
        <label>GV đăng ký từ</label><input type="datetime-local" th:field="*{lecturerStart}" required>
        <div class="field-error" th:errors="*{lecturerStart}"></div>
        <label>GV đăng ký đến</label><input type="datetime-local" th:field="*{lecturerEnd}" required>
        <div class="field-error" th:errors="*{lecturerEnd}"></div>
        <label>SV đăng ký từ</label><input type="datetime-local" th:field="*{studentStart}" required>
        <div class="field-error" th:errors="*{studentStart}"></div>
        <label>SV đăng ký đến</label><input type="datetime-local" th:field="*{studentEnd}" required>
        <div class="field-error" th:errors="*{studentEnd}"></div>
        <div class="field-block" data-applies-to="TLCN,KLTN">
            <label>Hạn GVPB nộp điểm</label>
            <input type="datetime-local" th:field="*{reviewDeadline}">
            <div class="field-error" th:errors="*{reviewDeadline}"></div>
        </div>
        <div class="field-block" data-applies-to="KLTN">
            <label>Ngày báo cáo hội đồng</label>
            <input type="datetime-local" th:field="*{defenseDate}">
            <div class="field-error" th:errors="*{defenseDate}"></div>
        </div>
        <p class="desc">Đợt mới được tạo ở trạng thái nháp. Sau khi kiểm tra thông tin, Trưởng khoa có thể mở đợt từ danh sách.</p>
        <button class="btn btn-primary" type="submit" th:text="${editing} ? 'Lưu thay đổi' : 'Tạo đợt'">Tạo đợt</button>
    </form>
</div>
</main>

<!-- Ẩn/hiện "Hạn GVPB" và "Ngày báo cáo hội đồng" theo loại đợt (mục 5.2):
     hạn GVPB chỉ có ở TLCN/KLTN, ngày báo cáo hội đồng chỉ có ở KLTN.
     Backend vẫn kiểm tra lại nên gửi giá trị thừa cũng bị từ chối. -->
<script th:inline="javascript">
    (function () {
        var typeSelect = document.getElementById('type');
        var optionalFields = Array.prototype.slice.call(
                document.querySelectorAll('[data-applies-to]'));

        function syncOptionalFields() {
            var type = typeSelect ? typeSelect.value : '';
            optionalFields.forEach(function (block) {
                var applies = (block.getAttribute('data-applies-to') || '').split(',');
                var allowed = !!(type && applies.indexOf(type) >= 0);
                var input = block.querySelector('input');
                if (allowed) {
                    block.classList.remove('is-hidden');
                    block.removeAttribute('aria-hidden');
                    if (input) {
                        input.disabled = false;
                        input.removeAttribute('aria-hidden');
                    }
                } else {
                    // Xoá giá trị để không gửi mốc thời gian không hợp lệ lên server.
                    block.classList.add('is-hidden');
                    block.setAttribute('aria-hidden', 'true');
                    if (input) {
                        input.value = '';
                        input.disabled = true;
                        input.setAttribute('aria-hidden', 'true');
                    }
                }
            });
        }

        if (typeSelect) typeSelect.addEventListener('change', syncOptionalFields);
        syncOptionalFields();
    })();
</script>

</body>
</html>
