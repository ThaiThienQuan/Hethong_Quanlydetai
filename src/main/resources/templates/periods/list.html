<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý đợt đăng ký')}"></head>
<body class="app-page">
<a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
<div th:replace="~{fragments/nav :: nav}"></div>
<main id="main-content" class="app-main"><div class="box xwide">
    <div class="box-head">
        <h2>Quản lý đợt đăng ký</h2>
        <div class="box-head-actions">
            <a class="btn btn-primary" th:href="@{/periods/new}">
                <svg class="ui-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                Tạo đợt đăng ký
            </a>
        </div>
    </div>
    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table>
        <thead><tr><th>Tên đợt</th><th>Loại</th><th>Giai đoạn GV</th><th>Giai đoạn SV</th><th>Hạn phản biện</th><th>Ngày hội đồng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody>
        <tr th:each="p : ${periods}">
            <td th:text="${p.name}">Đợt đăng ký</td>
            <td th:text="${p.periodType.displayName}">Khóa luận tốt nghiệp</td>
            <td><span th:text="${#temporals.format(p.lecturerStartAt, 'dd/MM/yyyy HH:mm')}"></span> – <span th:text="${#temporals.format(p.lecturerEndAt, 'dd/MM/yyyy HH:mm')}"></span></td>
            <td><span th:text="${#temporals.format(p.studentStartAt, 'dd/MM/yyyy HH:mm')}"></span> – <span th:text="${#temporals.format(p.studentEndAt, 'dd/MM/yyyy HH:mm')}"></span></td>
            <td th:text="${p.reviewDeadline != null ? #temporals.format(p.reviewDeadline, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td th:text="${p.councilReportDate != null ? #temporals.format(p.councilReportDate, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td><span class="badge" th:classappend="${'st-' + p.status.name()}" th:text="${p.status}">DRAFT</span></td>
            <td class="actions">
                <a class="btn btn-soft-primary btn-sm" th:if="${p.status.name() == 'DRAFT'}" th:href="@{/periods/{id}/edit(id=${p.id})}">Sửa</a>
                <form th:if="${p.status.name() == 'DRAFT'}" th:action="@{/periods/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('Xóa đợt nháp này? Chỉ xóa được khi chưa có đề tài hoặc hội đồng liên kết.');">
                    <button class="btn btn-soft-danger btn-sm" type="submit">Xóa đợt nháp</button>
                </form>
                <form th:if="${p.status.name() == 'DRAFT'}" th:action="@{/periods/{id}/open(id=${p.id})}" method="post"><button class="btn btn-soft-success btn-sm" type="submit">Mở đợt</button></form>
                <form th:if="${p.status.name() == 'PUBLISHED' or p.status.name() == 'OPEN'}" th:action="@{/periods/{id}/close(id=${p.id})}" method="post"><button class="btn btn-soft-warning btn-sm" type="submit">Đóng đợt</button></form>
                <form th:if="${p.status.name() == 'CLOSED'}" th:action="@{/periods/{id}/reopen(id=${p.id})}" method="post" onsubmit="return confirm('Mở lại đợt này? Chỉ có thể mở khi còn thời gian đăng ký và chưa có hội đồng.');"><button class="btn btn-soft-primary btn-sm" type="submit">Mở lại</button></form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(periods)}"><td colspan="8">Chưa có đợt đăng ký nào.</td></tr>
        </tbody>
    </table></div>
</div>
</main>

</body>
</html>
