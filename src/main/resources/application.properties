spring.application.name=Hethong_QuanlyDetai

# H2 is the default profile so the project runs immediately after checkout.
spring.datasource.url=jdbc:h2:mem:quanlydetai;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Switch to MySQL by activating the mysql profile and supplying credentials.
spring.profiles.active=${APP_PROFILE:default}
