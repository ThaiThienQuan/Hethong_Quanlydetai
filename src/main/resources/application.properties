spring.application.name=topicmanagement

# =====================================================================
# Kết nối MySQL (mục 7.4: đọc từ biến môi trường, không lưu secret trong repo)
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/student_topic_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# =====================================================================
# JPA / Hibernate
# Schema do database/HT_QLDT.sql quản lý, không để Hibernate tự tạo bảng.
# validate giúp phát hiện lệch cột ngay khi khởi động.
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# =====================================================================
# Thymeleaf - tắt cache khi phát triển, bật khi chạy thật
# =====================================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# =====================================================================
# Múi giờ và định dạng (mục 7.6)
# =====================================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
app.locale=vi
app.time-zone=Asia/Ho_Chi_Minh
app.date-pattern=dd/MM/yyyy
app.date-time-pattern=dd/MM/yyyy HH:mm

# =====================================================================
# Nghiệp vụ (đọc qua @ConfigurationProperties - mục 7.4)
# =====================================================================
# Kích thước nhóm: đề bài ghi "tối đa 3", rubric ghi "3-5".
# Mặc định theo đề bài; nếu giảng viên chốt 3-5 thì chỉ đổi max-size=5 (A9).
app.group.min-size=1
app.group.max-size=3

# Thang điểm 0-10, ĐẠT khi điểm cuối >= ngưỡng này (A4)
app.passing-score=5.00

# Thư mục lưu báo cáo, nằm NGOÀI thư mục static để không tải trực tiếp bằng URL
app.storage.dir=${REPORT_STORAGE_DIR:./storage/reports}

# Định dạng và dung lượng tệp báo cáo (A7)
app.report.allowed-extensions=pdf,doc,docx
app.report.max-size-bytes=20971520

# Khóa tạm sau nhiều lần đăng nhập sai (5 lần / 15 phút)
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=15

# Phân trang
app.page-size=10

# =====================================================================
# Thông tin liên hệ quản trị viên (mục 5.1)
# Hiển thị cho người dùng khi cần trợ giúp: quên mật khẩu, tài khoản bị khoá,
# cần đặt lại mật khẩu. Đổi ở đây không phải sửa mã nguồn.
# Tài khoản admin cụ thể (tên/email/SĐT) lấy từ bảng users, các giá trị dưới
# đây là đầu mối hỗ trợ dự phòng của đơn vị.
# =====================================================================
app.support.unit-name=Khoa C\u00f4ng ngh\u1ec7 Th\u00f4ng tin
app.support.address=Ph\u00f2ng H\u00e0nh ch\u00ednh - T\u1ea7ng 2, T\u00f2a nh\u00e0 A, Tr\u01b0\u1eddng \u0110\u1ea1i h\u1ecdc
app.support.phone=0900000001
app.support.email=admin@demo.local
app.support.office-hours=S\u00e1ng: 8:00 - 11:30, Chi\u1ec1u: 14:00 - 17:00 (th\u1ee9 2 \u0111\u1ebfn th\u1ee9 6)
app.support.instruction=Vui l\u00f2ng cung c\u1ea5p t\u00ean \u0111\u0103ng nh\u1eadp v\u00e0 m\u00e3 sinh vi\u00ean / m\u00e3 gi\u1ea3ng vi\u00ean \u0111\u1ec3 Admin tra c\u1ee9u nhanh h\u01a1n.

# =====================================================================
# Gửi email khi công bố kết quả (mục 7.10 - rubric bắt buộc)
# SMTP lấy từ biến môi trường; dùng Mailpit/MailHog/Mailtrap cục bộ khi demo.
# enabled=false => chỉ ghi log và email_logs trạng thái SKIPPED, không gửi thật.
# =====================================================================
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@topicmanagement.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# =====================================================================
# Upload báo cáo
# =====================================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =====================================================================
# Log - không tắt hẳn, không log mật khẩu/token
# =====================================================================
logging.level.root=INFO
logging.level.vn.edu.demo.topicmanagement=INFO
logging.level.org.springframework.security=INFO

# =====================================================================
# Cổng
# =====================================================================
server.port=${SERVER_PORT:8080}